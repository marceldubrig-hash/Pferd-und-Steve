name: Preview walk test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-walk-test.yml"
      - "scenes/horse_cutout_rig.tscn"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preview dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify approved rig assets
        run: python tools/materialize_verified_rig_assets.py

      - name: Download Godot 4.3
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Validate Godot project headlessly
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Render walk animation key poses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math, os, re

          ROOT = Path(".")
          text = (ROOT / "scenes/horse_cutout_rig.tscn").read_text()
          W, H = 1448, 1086
          ORIGIN = (W / 2.0, H / 2.0)

          anim_match = re.search(
              r'\[sub_resource type="Animation" id="Animation_walk_test"\](.*?)(?=\n\[sub_resource|\n\[node)',
              text, re.S
          )
          if not anim_match:
              raise RuntimeError("Animation_walk_test missing")
          anim = anim_match.group(1)

          track_re = re.compile(
              r'tracks/(\d+)/path = NodePath\("([^"]+)"\).*?'
              r'tracks/\1/keys = \{.*?'
              r'"times": PackedFloat32Array\(([^)]*)\).*?'
              r'"values": \[([^\]]+)\]',
              re.S
          )
          tracks = []
          for m in track_re.finditer(anim):
              path = m.group(2)
              times = [float(v.strip()) for v in m.group(3).split(",") if v.strip()]
              raw_values = m.group(4).strip()
              if path.endswith(":rotation"):
                  values = [float(v.strip()) for v in raw_values.split(",") if v.strip()]
                  kind = "scalar"
              elif path.endswith(":position"):
                  values = [
                      (float(x), float(y))
                      for x, y in re.findall(
                          r'Vector2\(([-0-9.eE]+),\s*([-0-9.eE]+)\)',
                          raw_values
                      )
                  ]
                  kind = "vector2"
              else:
                  raise RuntimeError(f"unsupported walk preview track: {path}")
              if len(times) != len(values):
                  raise RuntimeError(f"key mismatch for {path}: times={times} values={values}")
              tracks.append({"path": path, "times": times, "values": values, "kind": kind})
          if len(tracks) < 4:
              raise RuntimeError(f"expected at least four walk tracks, found {len(tracks)}")

          def sample(track, t):
              times, values = track["times"], track["values"]
              if t <= times[0]:
                  return values[0]
              if t >= times[-1]:
                  return values[-1]
              for i in range(len(times)-1):
                  if times[i] <= t <= times[i+1]:
                      span = times[i+1] - times[i]
                      alpha = 0.0 if span == 0 else (t-times[i])/span
                      a, b = values[i], values[i+1]
                      if track["kind"] == "scalar":
                          return a + (b-a) * alpha
                      return (
                          a[0] + (b[0]-a[0]) * alpha,
                          a[1] + (b[1]-a[1]) * alpha,
                      )
              return values[-1]

          ext, atlas, nodes = {}, {}, []
          current_kind = None
          current = None
          ext_re = re.compile(r'^\[ext_resource type="[^"]+" path="([^"]+)" id="([^"]+)"\]$')
          sub_re = re.compile(r'^\[sub_resource type="AtlasTexture" id="([^"]+)"\]$')
          node_re = re.compile(r'^\[node name="([^"]+)" type="([^"]+)"(?: parent="([^"]+)")?\]$')
          vec_re = re.compile(r'Vector2\(([-0-9.eE]+),\s*([-0-9.eE]+)\)')
          rect_re = re.compile(r'Rect2\(([-0-9.eE]+),\s*([-0-9.eE]+),\s*([-0-9.eE]+),\s*([-0-9.eE]+)\)')
          ext_id_re = re.compile(r'ExtResource\("([^"]+)"\)')
          sub_id_re = re.compile(r'SubResource\("([^"]+)"\)')

          for raw in text.splitlines():
              line = raw.strip()
              if not line:
                  continue
              m = ext_re.match(line)
              if m:
                  ext[m.group(2)] = m.group(1).replace("res://", "")
                  current_kind = current = None
                  continue
              m = sub_re.match(line)
              if m:
                  current_kind = "atlas"
                  current = {"id": m.group(1), "atlas_id": None, "region": None}
                  atlas[current["id"]] = current
                  continue
              m = node_re.match(line)
              if m:
                  current_kind = "node"
                  current = {
                      "name": m.group(1), "type": m.group(2), "parent": m.group(3),
                      "position": (0.0,0.0), "rotation": 0.0, "scale": (1.0,1.0),
                      "z_index": 0, "texture_kind": None, "texture_id": None,
                      "order": len(nodes)
                  }
                  nodes.append(current)
                  continue
              if current_kind == "atlas":
                  if line.startswith("atlas ="):
                      m = ext_id_re.search(line)
                      if m: current["atlas_id"] = m.group(1)
                  elif line.startswith("region ="):
                      m = rect_re.search(line)
                      if m: current["region"] = tuple(float(m.group(i)) for i in range(1,5))
                  continue
              if current_kind == "node":
                  if line.startswith("position ="):
                      m = vec_re.search(line)
                      if m: current["position"] = (float(m.group(1)), float(m.group(2)))
                  elif line.startswith("rotation ="):
                      current["rotation"] = float(line.split("=",1)[1].strip())
                  elif line.startswith("scale ="):
                      m = vec_re.search(line)
                      if m: current["scale"] = (float(m.group(1)), float(m.group(2)))
                  elif line.startswith("z_index ="):
                      current["z_index"] = int(line.split("=",1)[1].strip())
                  elif line.startswith("texture = ExtResource"):
                      m = ext_id_re.search(line)
                      if m:
                          current["texture_kind"] = "ext"
                          current["texture_id"] = m.group(1)
                  elif line.startswith("texture = SubResource"):
                      m = sub_id_re.search(line)
                      if m:
                          current["texture_kind"] = "sub"
                          current["texture_id"] = m.group(1)

          def path_of(node):
              p=node["parent"]
              if p is None or p==".":
                  return node["name"]
              return p+"/"+node["name"]

          path_map={path_of(n):n for n in nodes}
          base_rot={p:n["rotation"] for p,n in path_map.items()}
          base_pos={p:n["position"] for p,n in path_map.items()}

          def mul(a,b):
              return (
                  a[0]*b[0]+a[1]*b[2], a[0]*b[1]+a[1]*b[3],
                  a[2]*b[0]+a[3]*b[2], a[2]*b[1]+a[3]*b[3],
                  a[0]*b[4]+a[1]*b[5]+a[4], a[2]*b[4]+a[3]*b[5]+a[5]
              )
          def local_matrix(node):
              x,y=node["position"]; sx,sy=node["scale"]; r=node["rotation"]
              c=math.cos(r); s=math.sin(r)
              return (c*sx,-s*sy,s*sx,c*sy,x,y)

          cache={}
          def load_ext(eid):
              if eid not in cache:
                  cache[eid]=Image.open(ROOT/ext[eid]).convert("RGBA")
              return cache[eid]
          def node_image(node):
              if node["texture_kind"]=="ext":
                  return load_ext(node["texture_id"]).copy()
              if node["texture_kind"]=="sub":
                  sub=atlas[node["texture_id"]]; src=load_ext(sub["atlas_id"])
                  x,y,w,h=sub["region"]
                  return src.crop((round(x),round(y),round(x+w),round(y+h)))
              return None
          def checker():
              im=Image.new("RGBA",(W,H),(226,226,226,255))
              d=ImageDraw.Draw(im); cell=32
              for y in range(0,H,cell):
                  for x in range(0,W,cell):
                      if ((x//cell)+(y//cell))%2:
                          d.rectangle((x,y,x+cell-1,y+cell-1),fill=(198,198,198,255))
              return im

          def render(t):
              for p,n in path_map.items():
                  n["rotation"]=base_rot[p]
                  n["position"]=base_pos[p]
              for tr in tracks:
                  target, prop = tr["path"].split(":",1)
                  if target not in path_map:
                      raise RuntimeError(f"animation target missing: {target}")
                  value = sample(tr,t)
                  if prop == "rotation":
                      path_map[target]["rotation"]=value
                  elif prop == "position":
                      path_map[target]["position"]=value
                  else:
                      raise RuntimeError(f"unsupported preview property: {tr['path']}")

              gm_cache={}; gz_cache={}
              def resolve(node):
                  path=path_of(node)
                  if path in gm_cache: return gm_cache[path],gz_cache[path]
                  local=local_matrix(node); pp=node["parent"]
                  if pp is None or pp==".":
                      gm=local; gz=node["z_index"]
                  else:
                      pm,pz=resolve(path_map[pp]); gm=mul(pm,local); gz=pz+node["z_index"]
                  gm_cache[path]=gm; gz_cache[path]=gz
                  return gm,gz

              dst=checker()
              sprites=[]
              for node in nodes:
                  if node["type"]=="Sprite2D" and node["texture_kind"] is not None:
                      _,gz=resolve(node); sprites.append((gz,node["order"],node))
              for _,_,node in sorted(sprites,key=lambda x:(x[0],x[1])):
                  im=node_image(node); gm,_=resolve(node)
                  sx=math.hypot(gm[0],gm[2]); sy=math.hypot(gm[1],gm[3])
                  rot=math.atan2(gm[2],gm[0])
                  im=im.resize((max(1,round(im.width*sx)),max(1,round(im.height*sy))),Image.Resampling.LANCZOS)
                  if abs(rot)>1e-10:
                      im=im.rotate(-math.degrees(rot),resample=Image.Resampling.BICUBIC,expand=True)
                  cx=ORIGIN[0]+gm[4]; cy=ORIGIN[1]+gm[5]
                  dst.alpha_composite(im,(round(cx-im.width/2),round(cy-im.height/2)))
              return dst.resize((640,480),Image.Resampling.LANCZOS)

          samples=[0.0,0.3,0.6,0.9]
          out=Image.new("RGB",(640*2,480*2),"black")
          draw=ImageDraw.Draw(out)
          for i,t in enumerate(samples):
              panel=render(t).convert("RGB")
              x=(i%2)*640; y=(i//2)*480
              out.paste(panel,(x,y))
              draw.rectangle((x,y,x+190,y+34),fill=(0,0,0))
              draw.text((x+10,y+9),f"WALK t={t:.2f}s",fill="white")

          Path("debug").mkdir(exist_ok=True)
          out.save("debug/walk_test_preview.jpg",quality=88,optimize=True)
          Path("debug/walk_test_validation.txt").write_text(
              f"source_commit={os.environ.get('GITHUB_SHA','unknown')}\n"
              "asset_integrity=success\n"
              "godot_4_3_headless=success\n"
              f"walk_track_count={len(tracks)}\n"
              "walk_animation_length=1.2\n"
              "preview_head_jaw_tail_state=static_scene_rest\n"
              + "\n".join(f"track={tr['path']} times={tr['times']} values={tr['values']}" for tr in tracks)
              + "\n"
          )
          PY

      - name: Commit walk preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/walk_test_preview.jpg debug/walk_test_validation.txt
          git commit -m "Record walk animation preview"
          git push origin HEAD:main
