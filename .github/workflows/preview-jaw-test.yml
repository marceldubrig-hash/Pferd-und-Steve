name: Preview jaw test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-jaw-test.yml"
      - "scenes/horse_cutout_rig.tscn"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preview dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify approved rig assets
        run: python tools/materialize_verified_rig_assets.py

      - name: Download Godot 4.3
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Validate Godot project headlessly
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Render jaw animation key poses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math
          import os
          import re

          ROOT = Path(".")
          SCENE = ROOT / "scenes/horse_cutout_rig.tscn"
          text = SCENE.read_text()
          W, H = 1448, 1086
          ORIGIN = (W / 2.0, H / 2.0)

          anim_match = re.search(
              r'\[sub_resource type="Animation" id="Animation_jaw_test"\](.*?)(?=\n\[sub_resource|\n\[node)',
              text,
              re.S,
          )
          if not anim_match:
              raise RuntimeError("Animation_jaw_test missing")
          values_match = re.search(r'"values": \[([^\]]+)\]', anim_match.group(1))
          if not values_match:
              raise RuntimeError("jaw_test key values missing")
          values = [float(v.strip()) for v in values_match.group(1).split(",")]
          if len(values) < 3:
              raise RuntimeError("jaw_test needs at least three key values")

          rest = values[0]
          distinct = sorted(set(values), reverse=True)
          primary_open = distinct[0]
          secondary_open = distinct[1] if len(distinct) > 2 else distinct[0]

          ext = {}
          atlas = {}
          nodes = []
          current_kind = None
          current = None

          ext_re = re.compile(r'^\[ext_resource type="[^"]+" path="([^"]+)" id="([^"]+)"\]$')
          sub_re = re.compile(r'^\[sub_resource type="AtlasTexture" id="([^"]+)"\]$')
          node_re = re.compile(r'^\[node name="([^"]+)" type="([^"]+)"(?: parent="([^"]+)")?\]$')
          vec_re = re.compile(r'Vector2\(([-0-9.eE]+),\s*([-0-9.eE]+)\)')
          rect_re = re.compile(r'Rect2\(([-0-9.eE]+),\s*([-0-9.eE]+),\s*([-0-9.eE]+),\s*([-0-9.eE]+)\)')
          ext_id_re = re.compile(r'ExtResource\("([^"]+)"\)')
          sub_id_re = re.compile(r'SubResource\("([^"]+)"\)')

          for raw in text.splitlines():
              line = raw.strip()
              if not line:
                  continue

              m = ext_re.match(line)
              if m:
                  ext[m.group(2)] = m.group(1).replace("res://", "")
                  current_kind = None
                  current = None
                  continue

              m = sub_re.match(line)
              if m:
                  current_kind = "atlas"
                  current = {"id": m.group(1), "atlas_id": None, "region": None}
                  atlas[current["id"]] = current
                  continue

              m = node_re.match(line)
              if m:
                  current_kind = "node"
                  current = {
                      "name": m.group(1),
                      "type": m.group(2),
                      "parent": m.group(3),
                      "position": (0.0, 0.0),
                      "rotation": 0.0,
                      "scale": (1.0, 1.0),
                      "z_index": 0,
                      "texture_kind": None,
                      "texture_id": None,
                      "order": len(nodes),
                  }
                  nodes.append(current)
                  continue

              if current_kind == "atlas":
                  if line.startswith("atlas ="):
                      m = ext_id_re.search(line)
                      if m:
                          current["atlas_id"] = m.group(1)
                  elif line.startswith("region ="):
                      m = rect_re.search(line)
                      if m:
                          current["region"] = tuple(float(m.group(i)) for i in range(1, 5))
                  continue

              if current_kind == "node":
                  if line.startswith("position ="):
                      m = vec_re.search(line)
                      if m:
                          current["position"] = (float(m.group(1)), float(m.group(2)))
                  elif line.startswith("rotation ="):
                      current["rotation"] = float(line.split("=", 1)[1].strip())
                  elif line.startswith("scale ="):
                      m = vec_re.search(line)
                      if m:
                          current["scale"] = (float(m.group(1)), float(m.group(2)))
                  elif line.startswith("z_index ="):
                      current["z_index"] = int(line.split("=", 1)[1].strip())
                  elif line.startswith("texture = ExtResource"):
                      m = ext_id_re.search(line)
                      if m:
                          current["texture_kind"] = "ext"
                          current["texture_id"] = m.group(1)
                  elif line.startswith("texture = SubResource"):
                      m = sub_id_re.search(line)
                      if m:
                          current["texture_kind"] = "sub"
                          current["texture_id"] = m.group(1)

          def path_of(node):
              parent = node["parent"]
              if parent is None or parent == ".":
                  return node["name"]
              return parent + "/" + node["name"]

          path_map = {path_of(n): n for n in nodes}
          jaw_pivot = path_map["HeadPivot/JawPivot"]

          def mul(a, b):
              return (
                  a[0]*b[0] + a[1]*b[2],
                  a[0]*b[1] + a[1]*b[3],
                  a[2]*b[0] + a[3]*b[2],
                  a[2]*b[1] + a[3]*b[3],
                  a[0]*b[4] + a[1]*b[5] + a[4],
                  a[2]*b[4] + a[3]*b[5] + a[5],
              )

          def local_matrix(node):
              x, y = node["position"]
              sx, sy = node["scale"]
              r = node["rotation"]
              c = math.cos(r)
              s = math.sin(r)
              return (c*sx, -s*sy, s*sx, c*sy, x, y)

          image_cache = {}
          def load_ext(ext_id):
              if ext_id not in image_cache:
                  image_cache[ext_id] = Image.open(ROOT / ext[ext_id]).convert("RGBA")
              return image_cache[ext_id]

          def node_image(node):
              if node["texture_kind"] == "ext":
                  return load_ext(node["texture_id"]).copy()
              if node["texture_kind"] == "sub":
                  sub = atlas[node["texture_id"]]
                  src = load_ext(sub["atlas_id"])
                  x, y, w, h = sub["region"]
                  return src.crop((round(x), round(y), round(x+w), round(y+h)))
              return None

          def checker():
              im = Image.new("RGBA", (W, H), (226, 226, 226, 255))
              d = ImageDraw.Draw(im)
              cell = 32
              for y in range(0, H, cell):
                  for x in range(0, W, cell):
                      if ((x // cell) + (y // cell)) % 2:
                          d.rectangle((x, y, x+cell-1, y+cell-1), fill=(198, 198, 198, 255))
              return im

          def render(rotation):
              jaw_pivot["rotation"] = rotation
              global_matrix = {}
              global_z = {}

              def resolve(node):
                  path = path_of(node)
                  if path in global_matrix:
                      return global_matrix[path], global_z[path]
                  local = local_matrix(node)
                  parent_path = node["parent"]
                  if parent_path is None or parent_path == ".":
                      gm = local
                      gz = node["z_index"]
                  else:
                      pm, pz = resolve(path_map[parent_path])
                      gm = mul(pm, local)
                      gz = pz + node["z_index"]
                  global_matrix[path] = gm
                  global_z[path] = gz
                  return gm, gz

              dst = checker()
              sprites = []
              for node in nodes:
                  if node["type"] == "Sprite2D" and node["texture_kind"] is not None:
                      _, gz = resolve(node)
                      sprites.append((gz, node["order"], node))

              for _, _, node in sorted(sprites, key=lambda x: (x[0], x[1])):
                  im = node_image(node)
                  gm, _ = resolve(node)
                  sx = math.hypot(gm[0], gm[2])
                  sy = math.hypot(gm[1], gm[3])
                  rot = math.atan2(gm[2], gm[0])
                  im = im.resize(
                      (max(1, round(im.width*sx)), max(1, round(im.height*sy))),
                      Image.Resampling.LANCZOS,
                  )
                  if abs(rot) > 1e-10:
                      im = im.rotate(-math.degrees(rot), resample=Image.Resampling.BICUBIC, expand=True)
                  cx = ORIGIN[0] + gm[4]
                  cy = ORIGIN[1] + gm[5]
                  dst.alpha_composite(im, (round(cx-im.width/2), round(cy-im.height/2)))

              crop = dst.crop((840, 0, 1448, 470))
              return crop.resize((608, 470), Image.Resampling.LANCZOS)

          poses = [
              ("REST -19 deg", rest),
              ("OPEN A -7 deg", primary_open),
              ("OPEN B -10 deg", secondary_open),
          ]

          out = Image.new("RGB", (608*3, 470), "black")
          draw = ImageDraw.Draw(out)
          for i, (label, value) in enumerate(poses):
              panel = render(value).convert("RGB")
              x = i * 608
              out.paste(panel, (x, 0))
              draw.rectangle((x, 0, x+230, 34), fill=(0, 0, 0))
              draw.text((x+10, 9), label, fill="white")

          Path("debug").mkdir(exist_ok=True)
          out.save("debug/jaw_test_preview.jpg", quality=86, optimize=True)
          Path("debug/jaw_test_validation.txt").write_text(
              f"source_commit={os.environ.get('GITHUB_SHA','unknown')}\n"
              "godot_4_3_headless=success\n"
              "asset_integrity=success\n"
              f"rest_rotation={rest}\n"
              f"primary_open_rotation={primary_open}\n"
              f"secondary_open_rotation={secondary_open}\n"
              "animation_length=0.6\n"
              "autoplay=jaw_test\n"
          )
          PY

      - name: Commit jaw preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/jaw_test_preview.jpg debug/jaw_test_validation.txt
          git commit -m "Record minimal jaw animation preview"
          git push origin HEAD:main
