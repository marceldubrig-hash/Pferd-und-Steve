name: Verify jaw test step 7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-jaw-test-step7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify approved rig assets
        run: python tools/materialize_verified_rig_assets.py

      - name: Download Godot 4.3
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Validate Godot project headlessly
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Verify jaw animation runtime data
        shell: bash
        run: |
          cat > tools/_verify_step7_runtime.gd <<'GDSCRIPT'
          extends SceneTree

          func fail(message: String) -> void:
              push_error(message)
              quit(1)

          func _init() -> void:
              var packed := load("res://scenes/horse_cutout_rig.tscn") as PackedScene
              if packed == null:
                  fail("Could not load horse_cutout_rig.tscn")
                  return

              var root := packed.instantiate()
              var player := root.get_node_or_null("AnimationPlayer") as AnimationPlayer
              if player == null:
                  fail("AnimationPlayer missing")
                  return

              if String(player.autoplay) != "jaw_test":
                  fail("jaw_test is not autoplay")
                  return

              var animation := player.get_animation("jaw_test")
              if animation == null:
                  fail("jaw_test animation missing")
                  return

              if absf(animation.length - 0.6) > 0.00001:
                  fail("jaw_test length mismatch")
                  return

              if animation.loop_mode != Animation.LOOP_LINEAR:
                  fail("jaw_test is not looping")
                  return

              var track := animation.find_track(NodePath("HeadPivot/JawPivot:rotation"), Animation.TYPE_VALUE)
              if track < 0:
                  fail("JawPivot rotation track missing")
                  return

              var expected_times := [0.0, 0.15, 0.3, 0.42, 0.6]
              var expected_values := [-0.331613, -0.15708, -0.331613, -0.226893, -0.331613]

              if animation.track_get_key_count(track) != expected_values.size():
                  fail("Unexpected jaw key count")
                  return

              for i in expected_values.size():
                  var actual_time := animation.track_get_key_time(track, i)
                  var actual_value := float(animation.track_get_key_value(track, i))
                  if absf(actual_time - expected_times[i]) > 0.00001:
                      fail("Jaw key time mismatch at %d" % i)
                      return
                  if absf(actual_value - expected_values[i]) > 0.00001:
                      fail("Jaw key value mismatch at %d" % i)
                      return

              print("PASS jaw_test animation runtime data")
              root.free()
              quit(0)
          GDSCRIPT
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tools/_verify_step7_runtime.gd
          rm tools/_verify_step7_runtime.gd

      - name: Install Godot 4.3 export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -q templates.tpz -d templates-unpacked
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/build-tools/34.0.0" ] || [ ! -d "$SDK_ROOT/platforms/android-34" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          fi

      - name: Prepare debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Android editor settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --import

      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android Debug" build/Pferd-und-Steve-step7-debug.apk

      - name: Record validation result
        shell: bash
        run: |
          APK_SHA="$(sha256sum build/Pferd-und-Steve-step7-debug.apk | awk '{print $1}')"
          mkdir -p debug
          cat > debug/jaw_test_android_validation.txt <<EOF
          source_commit=$GITHUB_SHA
          asset_integrity=success
          godot_4_3_headless=success
          jaw_runtime_check=success
          jaw_rest_deg=-19
          jaw_primary_open_deg=-9
          jaw_secondary_open_deg=-13
          animation_length_seconds=0.6
          autoplay=jaw_test
          android_debug_export=success
          apk_sha256=$APK_SHA
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/jaw_test_android_validation.txt
          git commit -m "Record jaw animation Android validation"
          git push origin HEAD:main

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Pferd-und-Steve-step7-debug
          path: build/Pferd-und-Steve-step7-debug.apk
          if-no-files-found: error
