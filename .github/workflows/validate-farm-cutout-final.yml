name: Validate final farm cutout integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-farm-cutout-final.yml"
      - "tools/validate_farm_cutout_final.py"
      - "tools/verify_farm_cutout_final_runtime.gd"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved rig assets
        run: python tools/materialize_verified_rig_assets.py

      - name: Verify exact Step-10 rig and integration invariants
        run: python tools/validate_farm_cutout_final.py

      - name: Download Godot 4.3
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Import and parse project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Verify instantiated farm runtime
        shell: bash
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tools/verify_farm_cutout_final_runtime.gd
          cat build/farm_final_runtime.txt >> debug/farm_cutout_final_validation.txt
          echo "GODOT_HEADLESS=SUCCESS" >> debug/farm_cutout_final_validation.txt

      - name: Install Godot 4.3 export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          rm -rf templates-unpacked
          mkdir -p templates-unpacked
          unzip -q templates.tpz -d templates-unpacked
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/build-tools/34.0.0" ] || [ ! -d "$SDK_ROOT/platforms/android-34" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          fi

      - name: Prepare debug keystore and Godot Android settings
        shell: bash
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Export final Step-11 Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --import
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android Debug" build/Pferd-und-Steve-step11-debug.apk
          APK_SHA="$(sha256sum build/Pferd-und-Steve-step11-debug.apk | awk '{print $1}')"
          echo "ANDROID_DEBUG_EXPORT=SUCCESS" >> debug/farm_cutout_final_validation.txt
          echo "APK_SHA256=$APK_SHA" >> debug/farm_cutout_final_validation.txt
          echo "VALIDATION_COMMIT=$GITHUB_SHA" >> debug/farm_cutout_final_validation.txt
          cat debug/farm_cutout_final_validation.txt

      - name: Upload final Step-11 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pferd-und-Steve-step11-final-apk
          path: build/Pferd-und-Steve-step11-debug.apk
          if-no-files-found: error

      - name: Commit final validation evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/farm_cutout_final_validation.txt
          git commit -m "Record final farm cutout validation"
          git push origin HEAD:main
