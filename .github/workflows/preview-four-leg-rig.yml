name: Preview four leg rig

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-four-leg-rig.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Render four-leg comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math

          W,H=1448,1086
          checker=Image.new("RGBA",(W,H),(220,220,220,255))
          d=ImageDraw.Draw(checker)
          cell=32
          for y in range(0,H,cell):
              for x in range(0,W,cell):
                  if ((x//cell)+(y//cell))%2:
                      d.rectangle((x,y,x+cell-1,y+cell-1),fill=(190,190,190,255))

          def place_center(dst,im,center,scale=1.0,rot_deg=0.0):
              nw=max(1,round(im.width*scale)); nh=max(1,round(im.height*scale))
              im2=im.resize((nw,nh),Image.Resampling.LANCZOS)
              if abs(rot_deg)>1e-9:
                  im2=im2.rotate(-rot_deg,resample=Image.Resampling.BICUBIC,expand=True)
              dst.alpha_composite(im2,(round(center[0]-im2.width/2),round(center[1]-im2.height/2)))

          master=Image.open("assets/horse/horse_master_standing_v01.png").convert("RGBA").resize((W,H),Image.Resampling.LANCZOS)
          body=Image.open("assets/horse/rig/horse_body_v01.png").convert("RGBA")
          tail=Image.open("assets/horse/rig/horse_tail_v01.png").convert("RGBA")
          fs=Image.open("assets/horse/rig/horse_front_legs_segments_sheet_v01.png").convert("RGBA")
          hs=Image.open("assets/horse/rig/horse_hind_legs_segments_sheet_v01.png").convert("RGBA")

          front_near=[fs.crop((183,32,544,640)),fs.crop((208,651,379,981)),fs.crop((240,1000,462,1305))]
          front_far=[fs.crop((715,64,989,656)),fs.crop((767,675,910,984)),fs.crop((766,1007,986,1296))]
          hind_near=[hs.crop((164,53,532,572)),hs.crop((174,553,386,906)),hs.crop((149,921,402,1326))]
          hind_far=[hs.crop((646,65,999,580)),hs.crop((764,553,990,909)),hs.crop((751,916,1013,1323))]

          def centers(root, upper_pos, lower_pivot, lower_pos, hoof_pivot, hoof_pos):
              u=(724+root[0]+0.5*upper_pos[0],543+root[1]+0.5*upper_pos[1])
              lp=(u[0]+0.5*lower_pivot[0],u[1]+0.5*lower_pivot[1])
              lo=(lp[0]+0.5*lower_pos[0],lp[1]+0.5*lower_pos[1])
              hp=(lo[0]+0.5*hoof_pivot[0],lo[1]+0.5*hoof_pivot[1])
              ho=(hp[0]+0.5*hoof_pos[0],hp[1]+0.5*hoof_pos[1])
              return [u,lo,ho]

          c_fn=centers((155,-53),(-19.75,275.924),(-33.065,274.582),(-3.209,148.182),(-21.145,149.993),(67.359,138.418))
          c_ff=centers((247,-53),(28.522,268.645),(-25.791,269.543),(0.943,138.502),(4.488,140.352),(41.127,131.459))
          c_hn=centers((-446,-74),(-20.816,234.353),(-36.101,235.597),(-13.638,163.241),(-34.745,160.511),(49.841,181.998))
          c_hf=centers((-262,-77),(32.071,233.122),(7.159,219.652),(38.005,165.058),(31.74,160.626),(-49.206,182.544))

          def draw_chain(dst,crops,cs):
              for im,center in zip(crops,cs):
                  place_center(dst,im,center,0.5)

          ref=checker.copy(); ref.alpha_composite(master)
          rig=checker.copy()

          # Behind body.
          tail_center=(724-449+0.39*(-102.18),543-198+0.39*270.66)
          place_center(rig,tail,tail_center,0.39)
          draw_chain(rig,hind_far,c_hf)
          draw_chain(rig,front_far,c_ff)

          # Body.
          place_center(rig,body,(724-76.5412,543-101.756),0.695201,math.degrees(0.0239099))

          # In front of body.
          draw_chain(rig,hind_near,c_hn)
          draw_chain(rig,front_near,c_fn)

          out=Image.new("RGBA",(W*2,H),(0,0,0,255))
          out.alpha_composite(ref,(0,0))
          out.alpha_composite(rig,(W,0))
          od=ImageDraw.Draw(out)
          od.rectangle((0,0,420,48),fill=(0,0,0,180)); od.text((12,13),"MASTER",fill="white")
          od.rectangle((W,0,W+600,48),fill=(0,0,0,180)); od.text((W+12,13),"CUTOUT BODY + ALL FOUR LEGS",fill="white")

          Path("debug").mkdir(exist_ok=True)
          out.convert("RGB").resize((1448,543),Image.Resampling.LANCZOS).save(
              "debug/four_leg_rig_preview.jpg",quality=72,optimize=True
          )
          PY

      - name: Commit preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/four_leg_rig_preview.jpg
          git commit -m "Record four leg rig preview"
          git push origin HEAD:main
