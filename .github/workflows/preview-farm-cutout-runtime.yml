name: Preview farm cutout runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-farm-cutout-runtime.yml"
      - "tools/render_farm_cutout_runtime_preview.gd"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.3
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Install virtual display and Pillow
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --disable-pip-version-check pillow

      - name: Verify approved rig assets
        run: python tools/materialize_verified_rig_assets.py

      - name: Import project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Render six real farm runtime cases
        shell: bash
        run: |
          mkdir -p build/farm_preview
          xvfb-run -a --server-args="-screen 0 1536x1384x24" \
            ./Godot_v4.3-stable_linux.x86_64 \
            --path . \
            --script res://tools/render_farm_cutout_runtime_preview.gd

      - name: Build contact sheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          src = Path("build/farm_preview")
          names = [
              ("FAR RIGHT", "01_far_right.png"),
              ("FAR LEFT", "02_far_left.png"),
              ("MID RIGHT — motion", "03_mid_right_motion.png"),
              ("MID LEFT — motion", "04_mid_left_motion.png"),
              ("NEAR RIGHT", "05_near_right.png"),
              ("NEAR LEFT", "06_near_left.png"),
          ]
          thumb = (512, 461)
          out = Image.new("RGB", (thumb[0]*2, thumb[1]*3), (0,0,0))
          d = ImageDraw.Draw(out)
          for i,(label,name) in enumerate(names):
              im = Image.open(src/name).convert("RGB").resize(thumb, Image.Resampling.LANCZOS)
              x = (i % 2) * thumb[0]
              y = (i // 2) * thumb[1]
              out.paste(im, (x,y))
              d.rectangle((x,y,x+260,y+32), fill=(0,0,0))
              d.text((x+8,y+9), label, fill="white")
          Path("debug").mkdir(exist_ok=True)
          out.save("debug/farm_cutout_runtime_preview.jpg", quality=90, optimize=True)
          Path("debug/farm_cutout_runtime_preview.txt").write_text((src/"runtime_preview.txt").read_text())
          PY

      - name: Commit runtime preview evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/farm_cutout_runtime_preview.jpg debug/farm_cutout_runtime_preview.txt
          git commit -m "Record farm cutout runtime preview"
          git push origin HEAD:main
