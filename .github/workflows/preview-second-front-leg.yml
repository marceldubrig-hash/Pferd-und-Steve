name: Preview second front leg

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-second-front-leg.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install preview dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Render comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math

          W,H = 1448,1086
          checker = Image.new("RGBA",(W,H),(220,220,220,255))
          d = ImageDraw.Draw(checker)
          cell=32
          for yy in range(0,H,cell):
              for xx in range(0,W,cell):
                  if ((xx//cell)+(yy//cell))%2:
                      d.rectangle((xx,yy,xx+cell-1,yy+cell-1),fill=(190,190,190,255))

          def place_center(dst, im, center, scale=1.0, rot_deg=0.0):
              nw=max(1,round(im.width*scale)); nh=max(1,round(im.height*scale))
              im2=im.resize((nw,nh),Image.Resampling.LANCZOS)
              if abs(rot_deg)>1e-9:
                  im2=im2.rotate(-rot_deg,resample=Image.Resampling.BICUBIC,expand=True)
              x=round(center[0]-im2.width/2); y=round(center[1]-im2.height/2)
              dst.alpha_composite(im2,(x,y))

          master = Image.open("assets/horse/horse_master_standing_v01.png").convert("RGBA").resize((W,H),Image.Resampling.LANCZOS)
          sheet = Image.open("assets/horse/rig/horse_front_legs_segments_sheet_v01.png").convert("RGBA")
          body = Image.open("assets/horse/rig/horse_body_v01.png").convert("RGBA")

          left = checker.copy()
          left.alpha_composite(master)

          right = checker.copy()

          # FrontFar is behind the body.
          far = {
              "upper": sheet.crop((715,64,989,656)),
              "lower": sheet.crop((767,675,910,984)),
              "hoof": sheet.crop((766,1007,986,1296)),
          }
          root_far=(724+247.0,543-53.0)
          up_far=(root_far[0]+0.5*28.522,root_far[1]+0.5*268.645)
          lp_far=(up_far[0]+0.5*(-25.791),up_far[1]+0.5*269.543)
          lo_far=(lp_far[0]+0.5*0.943,lp_far[1]+0.5*138.502)
          hp_far=(lo_far[0]+0.5*4.488,lo_far[1]+0.5*140.352)
          ho_far=(hp_far[0]+0.5*41.127,hp_far[1]+0.5*131.459)
          place_center(right,far["upper"],up_far,0.5)
          place_center(right,far["lower"],lo_far,0.5)
          place_center(right,far["hoof"],ho_far,0.5)

          place_center(right,body,(724-76.5412,543-101.756),0.695201,math.degrees(0.0239099))

          # FrontNear is in front of the body.
          near = {
              "upper": sheet.crop((183,32,544,640)),
              "lower": sheet.crop((208,651,379,981)),
              "hoof": sheet.crop((240,1000,462,1305)),
          }
          root_near=(724+155.0,543-53.0)
          up_near=(root_near[0]+0.5*(-19.75),root_near[1]+0.5*275.924)
          lp_near=(up_near[0]+0.5*(-33.065),up_near[1]+0.5*274.582)
          lo_near=(lp_near[0]+0.5*(-3.209),lp_near[1]+0.5*148.182)
          hp_near=(lo_near[0]+0.5*(-21.145),lo_near[1]+0.5*149.993)
          ho_near=(hp_near[0]+0.5*67.359,hp_near[1]+0.5*138.418)
          place_center(right,near["upper"],up_near,0.5)
          place_center(right,near["lower"],lo_near,0.5)
          place_center(right,near["hoof"],ho_near,0.5)

          out=Image.new("RGBA",(W*2,H),(0,0,0,255))
          out.alpha_composite(left,(0,0))
          out.alpha_composite(right,(W,0))
          od=ImageDraw.Draw(out)
          od.rectangle((0,0,420,48),fill=(0,0,0,180))
          od.text((12,13),"MASTER",fill="white")
          od.rectangle((W,0,W+650,48),fill=(0,0,0,180))
          od.text((W+12,13),"CUTOUT BODY + BOTH FRONT LEGS",fill="white")
          Path("debug").mkdir(exist_ok=True)
          small=out.convert("RGB").resize((1448,543),Image.Resampling.LANCZOS)
          small.save("debug/second_front_leg_preview.jpg",quality=72,optimize=True)
          PY

      - name: Commit preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/second_front_leg_preview.jpg
          git commit -m "Record second front leg preview"
          git push origin HEAD:main
