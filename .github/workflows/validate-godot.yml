name: Validate Godot Project

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-godot.yml"
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3
        shell: bash
        run: |
          curl -L --fail --retry 3             -o godot.zip             "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Parse and import project headlessly
        shell: bash
        run: |
          ./Godot_v4.3-stable_linux.x86_64             --headless             --path .             --editor             --quit
