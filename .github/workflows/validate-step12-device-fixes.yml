name: Validate Step 12 device fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-step12-device-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify approved rig assets
        run: python tools/materialize_verified_rig_assets.py

      - name: Verify Step 12 source invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rig = Path("scenes/horse_cutout_rig.tscn").read_text()
          main = Path("scripts/main.gd").read_text()

          required_rig = [
              'position = Vector2(303.171, -236.253)',
              'z_index = 12',
              'position = Vector2(-330, -77)',
              'scale = Vector2(-0.5, 0.5)',
              'z_index = -2',
              '"values": [0.0, 0.244346, 0.0, -0.191986, 0.0]',
              '"values": [-0.15708, 0.0, 0.20944, 0.0, -0.15708]',
              '"values": [0.174533, 0.0, -0.20944, 0.0, 0.174533]',
              '"times": PackedFloat32Array(0, 0.3, 0.6, 0.9, 1.2)',
          ]
          required_main = [
              'const WALK_MIN_PLAYBACK_SPEED := 0.72',
              'const WALK_MAX_PLAYBACK_SPEED := 1.60',
              'const WALK_MIN_AMPLITUDE := 0.86',
              'const WALK_MAX_AMPLITUDE := 1.20',
              'drag.velocity.length()',
              'mouse_motion.velocity.length()',
              '_apply_walk_motion_from_speed',
              '_set_walk_amplitude',
          ]

          missing = [x for x in required_rig if x not in rig]
          missing += [x for x in required_main if x not in main]
          if missing:
              raise SystemExit("Missing Step 12 invariants: " + repr(missing))
          print("PASS Step 12 source invariants")
          PY

      - name: Download Godot 4.3
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Validate and run project headlessly
        shell: bash
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee build/step12_editor.log
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 4 2>&1 | tee build/step12_runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid get index|Invalid call" build/step12_editor.log build/step12_runtime.log; then
            echo "Godot reported a script/runtime error"
            exit 1
          fi

      - name: Install Godot 4.3 export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          rm -rf templates-unpacked
          mkdir -p templates-unpacked
          unzip -q templates.tpz -d templates-unpacked
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/build-tools/34.0.0" ] || [ ! -d "$SDK_ROOT/platforms/android-34" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          fi

      - name: Prepare debug keystore and Godot Android settings
        shell: bash
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Export Step 12 Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --import
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android Debug" build/Pferd-und-Steve-step12-debug.apk

      - name: Record Step 12 validation evidence
        shell: bash
        run: |
          APK_SHA="$(sha256sum build/Pferd-und-Steve-step12-debug.apk | awk '{print $1}')"
          mkdir -p debug
          cat > debug/step12_android_validation.txt <<EOF
          source_commit=$GITHUB_SHA
          workflow_run_id=$GITHUB_RUN_ID
          asset_integrity=success
          step12_source_invariants=success
          godot_4_3_headless=success
          runtime_scene_load=success
          android_debug_export=success
          apk_sha256=$APK_SHA
          EOF
          cat debug/step12_android_validation.txt

      - name: Upload Step 12 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pferd-und-Steve-step12-final-apk
          path: build/Pferd-und-Steve-step12-debug.apk
          if-no-files-found: error

      - name: Commit validation evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/step12_android_validation.txt
          git commit -m "Record Step 12 Android validation"
          git push origin HEAD:main
