name: Validate autonomous horse wandering

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-autonomous-wander.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated runtime commits and frozen files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r e575102d0fd4d85a6367bf3bb8af8f67832fb616)" = "scripts/main.gd"
          test "$(git diff-tree --no-commit-id --name-only -r b32a8054f330134a5316fdb7ecfb336525b4c70b)" = "scripts/main.gd"
          test "$(git hash-object scenes/main.tscn)" = "336c90377be17ac57fe9b611a455ee544da6ba85"
          test "$(git hash-object scenes/horse_cutout_rig.tscn)" = "0c94231e6e037d2ff32f9a70fe69f459dcc870ac"
          ! grep -q "func _unhandled_input" scripts/main.gd
          ! grep -q "InputEventScreenDrag" scripts/main.gd
          ! grep -q "mouse_dragging" scripts/main.gd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify approved rig assets
        run: python tools/materialize_verified_rig_assets.py

      - name: Download Godot 4.3
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Create autonomous wander verifier
        shell: bash
        run: |
          mkdir -p build
          cat > build/verify_autonomous_wander.gd <<'GDSCRIPT'
          extends SceneTree

          const TEST_SIZES := [
              Vector2(1536.0, 658.0),
              Vector2(1536.0, 1384.0),
          ]

          func _initialize() -> void:
              call_deferred("_run")

          func _fail(message: String) -> void:
              push_error(message)
              quit(1)

          func _configure_background(main, size: Vector2) -> void:
              var bg: Sprite2D = main.get_node("Background")
              bg.position = size * 0.5
              var texture_size := bg.texture.get_size()
              bg.scale = Vector2.ONE * maxf(
                  size.x / texture_size.x,
                  size.y / texture_size.y
              )

          func _verify_frozen_collision(main) -> bool:
              var horse_root: Node2D = main.get_node("HorseRoot")
              for size in TEST_SIZES:
                  _configure_background(main, size)
                  for facing_right in [true, false]:
                      main.set_horse_facing_right(facing_right)
                      var bounds: Vector2 = main.call("_horse_visual_x_bounds_in_root_space")
                      var limits: Vector2 = main.call("_visible_horizontal_ground_limits", size)
                      for x_ratio in [0.0, 0.28, 0.50, 0.73, 0.90, 1.0]:
                          for requested_depth in [0.0, 0.28, 0.60]:
                              var result: Vector2 = main.call(
                                  "_resolve_horse_collision",
                                  size.x * x_ratio,
                                  requested_depth,
                                  size
                              )
                              var span: Vector2 = main.call(
                                  "_horse_screen_x_span",
                                  result.x,
                                  size,
                                  result.y,
                                  bounds
                              )
                              if span.x < limits.x - 0.75 or span.y > limits.y + 0.75:
                                  _fail(
                                      "FROZEN COLLISION REGRESSION size=%s facing=%s span=%s limits=%s"
                                      % [size, facing_right, span, limits]
                                  )
                                  return false
                              var required: float = main.call(
                                  "_minimum_projected_foot_y_ratio_for_screen_span",
                                  span.x,
                                  span.y,
                                  size
                              )
                              var distance_m := lerpf(12.0, 1.40, result.y)
                              var actual := 0.405 + (0.565 - 0.405) * (
                                  12.0 / maxf(distance_m, 0.01)
                              )
                              if actual + 0.0005 < required:
                                  _fail(
                                      "FROZEN REAR CURVE REGRESSION size=%s facing=%s actual=%s required=%s"
                                      % [size, facing_right, actual, required]
                                  )
                                  return false
              return true

          func _run() -> void:
              var packed := load("res://scenes/main.tscn") as PackedScene
              if packed == null:
                  _fail("Could not load main.tscn")
                  return

              var main = packed.instantiate()
              root.add_child(main)
              await process_frame
              await process_frame
              main.set_process(false)

              if main.has_method("_unhandled_input"):
                  _fail("Direct input handler still exists")
                  return

              var walk_player: AnimationPlayer = main.get_node(
                  "HorseRoot/HorseVisual/RigSpace/HorseCutoutRig/WalkAnimationPlayer"
              )
              if walk_player == null:
                  _fail("WalkAnimationPlayer missing")
                  return

              main.wander_rng.seed = 424242
              main.wander_position = Vector2(0.5, 0.28)
              var saw_left := false
              var saw_right := false
              for _index in range(64):
                  main.call("_choose_new_wander_target")
                  var target: Vector2 = main.wander_target
                  if target.x < 0.12 or target.x > 0.88:
                      _fail("Wander X target outside configured range: %s" % target)
                      return
                  if target.y < 0.04 or target.y > 0.55:
                      _fail("Wander depth target outside configured range: %s" % target)
                      return
                  saw_left = saw_left or target.x < 0.45
                  saw_right = saw_right or target.x > 0.55

              if not saw_left or not saw_right:
                  _fail("Random target sampling did not cover both yard sides")
                  return

              main.wander_pause_remaining = 0.0
              main.wander_reroute_remaining = 100.0
              main.wander_position = Vector2(0.40, 0.28)
              main.wander_target = Vector2(0.70, 0.36)
              var start_position: Vector2 = main.wander_position
              for _step in range(30):
                  main.call("_process", 0.1)

              if main.wander_position.x <= start_position.x + 0.05:
                  _fail("Autonomous controller did not move toward target")
                  return
              if main.horse_visual.scale.x <= 0.0:
                  _fail("Horse did not face right while moving right")
                  return
              if not main.horse_is_walking or not walk_player.is_playing():
                  _fail("Walk animation is not active during travel")
                  return

              main.wander_target = Vector2(0.20, main.wander_position.y)
              main.wander_reroute_remaining = 100.0
              main.call("_process", 0.1)
              if main.horse_visual.scale.x >= 0.0:
                  _fail("Horse did not face left after direction change")
                  return

              main.call("_begin_wander_pause")
              if main.horse_is_walking or walk_player.is_playing():
                  _fail("Walk animation did not pause during idle")
                  return
              if main.wander_pause_remaining < 1.5 or main.wander_pause_remaining > 4.5:
                  _fail("Idle pause outside configured range")
                  return

              if not _verify_frozen_collision(main):
                  return

              print("PASS autonomous wander, direction changes, idle pauses, no drag, frozen collision")
              quit(0)
          GDSCRIPT

      - name: Import and run autonomous wander verifier
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script build/verify_autonomous_wander.gd 2>&1 | tee build/autonomous_wander.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid get index|Invalid call|ERROR:" build/autonomous_wander.log; then
            echo "Autonomous wander verifier reported an error"
            exit 1
          fi

      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-wander-validation-log
          path: build/autonomous_wander.log
          if-no-files-found: error
