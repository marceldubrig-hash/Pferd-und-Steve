name: Analyze horse leg sheets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-horse-leg-sheets.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image analysis dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Analyze confirmed horse leg sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil
          import cv2
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont

          OUT = Path("leg-sheet-analysis")
          OUT.mkdir(exist_ok=True)

          SHEETS = {
              "front": Path("assets/horse/rig/horse_front_legs_segments_sheet_v01.png"),
              "hind": Path("assets/horse/rig/horse_hind_legs_segments_sheet_v01.png"),
          }

          # Copy source/reference images byte-for-byte into the analysis artifact.
          # This does not mutate repository assets.
          for src in [
              *SHEETS.values(),
              Path("assets/horse/horse_master_standing_v01.png"),
              Path("assets/horse/rig/horse_body_v01.png"),
          ]:
              if src.is_file():
                  shutil.copyfile(src, OUT / src.name)

          def checker(size, cell=24):
              w, h = size
              yy, xx = np.indices((h, w))
              v = np.where(((xx // cell) + (yy // cell)) % 2 == 0, 232, 202).astype(np.uint8)
              arr = np.dstack([v, v, v])
              return Image.fromarray(arr, "RGB")

          def meaningful_components(alpha, threshold):
              mask = (alpha >= threshold).astype(np.uint8)
              count, labels, stats, centroids = cv2.connectedComponentsWithStats(mask, connectivity=8)
              comps = []
              tiny = []
              for label in range(1, count):
                  x, y, cw, ch, area = [int(v) for v in stats[label]]
                  cx, cy = [float(v) for v in centroids[label]]
                  item = {
                      "raw_label": int(label),
                      "bbox_xywh": [x, y, cw, ch],
                      "bbox_xyxy_exclusive": [x, y, x + cw, y + ch],
                      "mask_area_px": area,
                      "cx": round(cx, 3),
                      "cy": round(cy, 3),
                  }
                  (comps if area >= 200 else tiny).append(item)
              comps.sort(key=lambda c: (c["bbox_xywh"][1], c["bbox_xywh"][0]))
              for i, c in enumerate(comps, 1):
                  c["id"] = f"T{threshold}_C{i}"
              return comps, tiny

          def edge_anchor(alpha, bbox, threshold, edge, band_fraction=0.08):
              x, y, w, h = bbox
              crop = alpha[y:y+h, x:x+w]
              mask = crop >= threshold
              band = max(1, round(h * band_fraction))
              if edge == "top":
                  ys = range(0, min(h, band))
              else:
                  ys = range(max(0, h-band), h)
              sub = mask[list(ys), :]
              yy, xx = np.nonzero(sub)
              if not len(xx):
                  return None
              y0 = 0 if edge == "top" else max(0, h-band)
              return [
                  round(x + float(xx.mean()), 3),
                  round(y + y0 + float(yy.mean()), 3),
              ]

          def crop_digest(im, bbox):
              x, y, w, h = bbox
              raw = np.array(im.crop((x, y, x+w, y+h)).convert("RGBA")).tobytes()
              return hashlib.sha256(raw).hexdigest()

          all_results = {}
          for kind, path in SHEETS.items():
              im = Image.open(path).convert("RGBA")
              w, h = im.size
              rgba = np.array(im)
              alpha = rgba[:, :, 3]
              nonzero = alpha > 0
              ys, xs = np.nonzero(nonzero)
              raw_alpha_bbox = [int(xs.min()), int(ys.min()), int(xs.max()) + 1, int(ys.max()) + 1] if len(xs) else None

              thresholds = {}
              for threshold in (1, 4, 16, 64, 128):
                  comps, tiny = meaningful_components(alpha, threshold)
                  for c in comps:
                      c["top_anchor_source_px"] = edge_anchor(alpha, c["bbox_xywh"], threshold, "top")
                      c["bottom_anchor_source_px"] = edge_anchor(alpha, c["bbox_xywh"], threshold, "bottom")
                      c["crop_rgba_sha256"] = crop_digest(im, c["bbox_xywh"])
                  thresholds[str(threshold)] = {
                      "meaningful_component_count_area_ge_200": len(comps),
                      "tiny_component_count_area_lt_200": len(tiny),
                      "components": comps,
                  }

              result = {
                  "file": str(path),
                  "file_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "native_size_px": [w, h],
                  "mode": "RGBA",
                  "raw_alpha_gt_0_bbox_xyxy_exclusive": raw_alpha_bbox,
                  "raw_alpha_gt_0_pixel_count": int(nonzero.sum()),
                  "alpha_min_nonzero": int(alpha[nonzero].min()) if nonzero.any() else None,
                  "alpha_max": int(alpha.max()),
                  "thresholds": thresholds,
              }
              all_results[kind] = result

              # Use alpha>=16 for robust visual labeling; this removes isolated
              # one-pixel alpha debris while preserving actual cutout edges.
              comps = thresholds["16"]["components"]
              bg = checker(im.size).convert("RGBA")
              bg.alpha_composite(im)
              draw = ImageDraw.Draw(bg)
              font = ImageFont.load_default()
              for c in comps:
                  x, y, cw, ch = c["bbox_xywh"]
                  draw.rectangle([x, y, x + cw - 1, y + ch - 1], outline=(255, 0, 0, 255), width=max(3, min(w, h)//300))
                  draw.rectangle([x, y, x + 72, y + 19], fill=(255, 255, 255, 230))
                  draw.text((x + 3, y + 3), c["id"], fill=(180, 0, 0, 255), font=font)
                  for key, fill in [("top_anchor_source_px", (0,0,255,255)), ("bottom_anchor_source_px", (0,160,0,255))]:
                      p = c.get(key)
                      if p:
                          px, py = p
                          r = 7
                          draw.ellipse([px-r, py-r, px+r, py+r], fill=fill)
              bg.convert("RGB").save(OUT / f"{kind}_annotated_t16.jpg", quality=90, optimize=True)

              cards = []
              for c in comps:
                  x, y, cw, ch = c["bbox_xywh"]
                  crop = im.crop((x, y, x+cw, y+ch))
                  max_side = 320
                  scale = min(max_side / crop.width, max_side / crop.height, 1.0)
                  resized = crop.resize((max(1, round(crop.width * scale)), max(1, round(crop.height * scale))), Image.Resampling.LANCZOS)
                  card = checker((360, 390), cell=18).convert("RGBA")
                  px = (360 - resized.width) // 2
                  py = 32 + (320 - resized.height) // 2
                  card.alpha_composite(resized, (px, py))
                  d = ImageDraw.Draw(card)
                  d.rectangle([0, 0, 359, 31], fill=(255,255,255,255))
                  d.text((8, 8), f'{c["id"]} bbox={c["bbox_xywh"]}', fill=(0,0,0,255), font=font)
                  cards.append(card.convert("RGB"))

              cols = 3
              rows = max(1, (len(cards) + cols - 1)//cols)
              sheet = Image.new("RGB", (cols*360, rows*390), "white")
              for i, card in enumerate(cards):
                  sheet.paste(card, ((i%cols)*360, (i//cols)*390))
              sheet.save(OUT / f"{kind}_components_t16.jpg", quality=92, optimize=True)

          (OUT / "leg_sheet_analysis.json").write_text(json.dumps(all_results, indent=2), encoding="utf-8")
          # Keep logs concise and authoritative.
          summary = {}
          for kind, r in all_results.items():
              summary[kind] = {
                  "file_sha256": r["file_sha256"],
                  "native_size_px": r["native_size_px"],
                  "raw_alpha_gt_0_bbox_xyxy_exclusive": r["raw_alpha_gt_0_bbox_xyxy_exclusive"],
                  "threshold_component_counts": {
                      t: len(v["components"]) for t, v in r["thresholds"].items()
                  },
                  "t16_components": r["thresholds"]["16"]["components"],
              }
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: horse-leg-sheet-analysis
          path: leg-sheet-analysis/
          if-no-files-found: error
          retention-days: 7
