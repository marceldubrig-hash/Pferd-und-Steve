name: Validate background music and app icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-music-and-icon.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Guard frozen runtime files and icon configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/main.gd)" = "f9282fce26465491dee07d29bd8d5f7fb0a519f1"
          test "$(git hash-object scenes/main.tscn)" = "336c90377be17ac57fe9b611a455ee544da6ba85"
          test "$(git hash-object scenes/horse_cutout_rig.tscn)" = "0c94231e6e037d2ff32f9a70fe69f459dcc870ac"
          grep -Fq 'config/icon="res://assets/icons/app_icon_512.png"' project.godot
          grep -Fq 'launcher_icons/main_192x192="res://assets/icons/app_icon_192.png"' export_presets.cfg
          grep -Fq 'launcher_icons/adaptive_foreground_432x432="res://assets/icons/app_icon_adaptive_foreground_432.png"' export_presets.cfg
          grep -Fq 'launcher_icons/adaptive_background_432x432="res://assets/icons/app_icon_adaptive_background_432.png"' export_presets.cfg

      - name: Download Godot 4.3
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Create runtime verifier
        shell: bash
        run: |
          mkdir -p build
          cat > build/verify_music_and_icon.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              call_deferred("_run")

          func _fail(message: String) -> void:
              push_error(message)
              quit(1)

          func _run() -> void:
              if ProjectSettings.get_setting("autoload/BackgroundMusic", "") != "*res://scripts/background_music.gd":
                  _fail("BackgroundMusic autoload is not configured")
                  return

              var music_script := load("res://scripts/background_music.gd")
              if music_script == null:
                  _fail("Background music script could not be loaded")
                  return

              var music = music_script.new()
              root.add_child(music)
              await process_frame

              if music.music_player == null:
                  _fail("Music player was not created")
                  return
              if not (music.music_player.stream is AudioStreamOggVorbis):
                  _fail("Background music is not an OGG Vorbis stream")
                  return
              if not music.music_player.stream.loop:
                  _fail("Background music loop is disabled")
                  return
              if not music.music_player.playing:
                  _fail("Background music did not start")
                  return
              if not is_equal_approx(music.music_player.volume_db, -8.0):
                  _fail("Unexpected background volume")
                  return

              var icon_checks := {
                  "res://assets/icons/app_icon_192.png": Vector2i(192, 192),
                  "res://assets/icons/app_icon_512.png": Vector2i(512, 512),
                  "res://assets/icons/app_icon_adaptive_background_432.png": Vector2i(432, 432),
                  "res://assets/icons/app_icon_adaptive_foreground_432.png": Vector2i(432, 432),
              }
              for path in icon_checks:
                  var image := Image.load_from_file(path)
                  if image == null or image.is_empty():
                      _fail("Could not load icon: %s" % path)
                      return
                  if image.get_size() != icon_checks[path]:
                      _fail("Incorrect icon size for %s: %s" % [path, image.get_size()])
                      return

              var main_scene := load("res://scenes/main.tscn") as PackedScene
              if main_scene == null:
                  _fail("Main scene could not be loaded")
                  return
              var main = main_scene.instantiate()
              root.add_child(main)
              await process_frame

              print("PASS continuous background music, app icons, main scene, frozen runtime blobs")
              quit(0)
          GDSCRIPT

      - name: Import and run verifier
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script build/verify_music_and_icon.gd 2>&1 | tee build/music_and_icon.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid get index|Invalid call|ERROR:" build/music_and_icon.log; then
            echo "Music and icon verifier reported an error"
            exit 1
          fi

      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: music-and-icon-validation-log
          path: build/music_and_icon.log
          if-no-files-found: error
