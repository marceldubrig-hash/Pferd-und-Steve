name: Preview hind leg source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-hind-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Build compact source preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          hind=Image.open("assets/horse/rig/horse_hind_legs_segments_sheet_v01.png").convert("RGBA")
          master=Image.open("assets/horse/horse_master_standing_v01.png").convert("RGBA")

          hprev=hind.resize((449,561),Image.Resampling.LANCZOS)
          mprev=master.resize((683,512),Image.Resampling.LANCZOS)

          canvas=Image.new("RGB",(1200,620),"white")
          checker=Image.new("RGB",(1200,620),(220,220,220))
          d=ImageDraw.Draw(checker)
          cell=24
          for y in range(0,620,cell):
              for x in range(0,1200,cell):
                  if ((x//cell)+(y//cell))%2:
                      d.rectangle((x,y,x+cell-1,y+cell-1),fill=(190,190,190))

          canvas=checker
          canvas.paste(hprev.convert("RGB"),(20,40))
          canvas.paste(mprev.convert("RGB"),(490,65))
          d=ImageDraw.Draw(canvas)
          d.rectangle((0,0,470,34),fill="black")
          d.text((10,9),"HIND SHEET — LEFT COLUMN / RIGHT COLUMN",fill="white")
          d.rectangle((480,0,1199,34),fill="black")
          d.text((490,9),"MASTER POSE",fill="white")

          Path("debug").mkdir(exist_ok=True)
          canvas.save("debug/hind_source_preview.jpg",quality=78,optimize=True)
          PY
      - name: Commit preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/hind_source_preview.jpg
          git commit -m "Record hind leg source preview"
          git push origin HEAD:main
