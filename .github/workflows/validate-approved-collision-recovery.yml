name: Validate approved collision recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-approved-collision-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated recovery commit and frozen blobs
        shell: bash
        run: |
          set -euo pipefail
          RECOVERY_COMMIT="fd0962080edf756030a0b2a5a06cb5c1315ea859"
          CHANGED="$(git diff-tree --no-commit-id --name-only -r "$RECOVERY_COMMIT")"
          echo "Recovery changed paths:"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "scripts/main.gd"

          MAIN_BLOB="$(git hash-object scripts/main.gd)"
          MAIN_SCENE_BLOB="$(git hash-object scenes/main.tscn)"
          RIG_BLOB="$(git hash-object scenes/horse_cutout_rig.tscn)"

          echo "main.gd=$MAIN_BLOB"
          echo "main.tscn=$MAIN_SCENE_BLOB"
          echo "horse_cutout_rig.tscn=$RIG_BLOB"

          test "$MAIN_BLOB" = "a32408d507f0ee1c928c766f214666bedad65175"
          test "$MAIN_SCENE_BLOB" = "336c90377be17ac57fe9b611a455ee544da6ba85"
          test "$RIG_BLOB" = "0c94231e6e037d2ff32f9a70fe69f459dcc870ac"

      - name: Verify approved collision semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const LEFT_OUTER_GROUND_Y_RATIO := 0.600' scripts/main.gd
          grep -F 'const LEFT_OBSTACLE_GROUND_Y_RATIO := 0.585' scripts/main.gd
          grep -F 'const RIGHT_OBSTACLE_GROUND_Y_RATIO := 0.585' scripts/main.gd
          grep -F 'const RIGHT_OUTER_GROUND_Y_RATIO := 0.600' scripts/main.gd
          grep -F 'const LEFT_OBSTACLE_X_RATIO := 0.36' scripts/main.gd
          grep -F 'const LEFT_OPEN_X_RATIO := 0.43' scripts/main.gd
          grep -F 'const RIGHT_OPEN_X_RATIO := 0.80' scripts/main.gd
          grep -F 'const RIGHT_OBSTACLE_X_RATIO := 0.87' scripts/main.gd
          grep -F 'func _minimum_projected_foot_y_ratio_for_x(x_ratio: float) -> float:' scripts/main.gd
          grep -F 'func _minimum_depth_t_for_x(x_ratio: float) -> float:' scripts/main.gd

          ! grep -F 'FARM_SOURCE_SIZE' scripts/main.gd
          ! grep -F 'HORSE_HALF_WIDTH_TO_PROJECTED_HEIGHT' scripts/main.gd
          ! grep -F '_minimum_depth_t_for_screen_x' scripts/main.gd
          ! grep -F '_clamp_horse_screen_x' scripts/main.gd
          ! grep -F 'LEFT_SIDE_FENCE_SOURCE_X' scripts/main.gd
          ! grep -F 'RIGHT_SIDE_FENCE_SOURCE_X' scripts/main.gd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify approved rig assets
        run: python tools/materialize_verified_rig_assets.py

      - name: Download Godot 4.3
        shell: bash
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Parse and run main scene headlessly
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee build/recovery_editor.log
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 4 2>&1 | tee build/recovery_runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid get index|Invalid call" build/recovery_editor.log build/recovery_runtime.log; then
            echo "Godot reported a script/runtime error"
            exit 1
          fi

      - name: Install Godot 4.3 export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          rm -rf templates-unpacked
          mkdir -p templates-unpacked
          unzip -q templates.tpz -d templates-unpacked
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/build-tools/34.0.0" ] || [ ! -d "$SDK_ROOT/platforms/android-34" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          fi

      - name: Prepare debug keystore and Godot Android settings
        shell: bash
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Export approved collision recovery APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --import
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android Debug" build/Pferd-und-Steve-approved-collision-recovery-debug.apk
          sha256sum build/Pferd-und-Steve-approved-collision-recovery-debug.apk | tee build/apk_sha256.txt

      - name: Upload approved collision recovery APK
        uses: actions/upload-artifact@v4
        with:
          name: Pferd-und-Steve-approved-collision-recovery-debug
          path: |
            build/Pferd-und-Steve-approved-collision-recovery-debug.apk
            build/apk_sha256.txt
          if-no-files-found: error
