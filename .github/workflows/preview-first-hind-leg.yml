name: Preview first hind leg layering

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-first-hind-leg.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Render hind layering comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math

          W,H=1448,1086
          checker=Image.new("RGBA",(W,H),(220,220,220,255))
          d=ImageDraw.Draw(checker)
          cell=32
          for y in range(0,H,cell):
              for x in range(0,W,cell):
                  if ((x//cell)+(y//cell))%2:
                      d.rectangle((x,y,x+cell-1,y+cell-1),fill=(190,190,190,255))

          def place_center(dst,im,center,scale=1.0,rot_deg=0.0):
              nw=max(1,round(im.width*scale)); nh=max(1,round(im.height*scale))
              im2=im.resize((nw,nh),Image.Resampling.LANCZOS)
              if abs(rot_deg)>1e-9:
                  im2=im2.rotate(-rot_deg,resample=Image.Resampling.BICUBIC,expand=True)
              dst.alpha_composite(im2,(round(center[0]-im2.width/2),round(center[1]-im2.height/2)))

          master=Image.open("assets/horse/horse_master_standing_v01.png").convert("RGBA").resize((W,H),Image.Resampling.LANCZOS)
          body=Image.open("assets/horse/rig/horse_body_v01.png").convert("RGBA")
          tail=Image.open("assets/horse/rig/horse_tail_v01.png").convert("RGBA")
          sheet=Image.open("assets/horse/rig/horse_hind_legs_segments_sheet_v01.png").convert("RGBA")

          crops={
            "upper":sheet.crop((164,53,532,572)),
            "lower":sheet.crop((174,553,386,906)),
            "hoof":sheet.crop((149,921,402,1326)),
          }

          root=(724-446.0,543-74.0)
          upper=(root[0]+0.5*(-20.816),root[1]+0.5*234.353)
          lower_pivot=(upper[0]+0.5*(-36.101),upper[1]+0.5*235.597)
          lower=(lower_pivot[0]+0.5*(-13.638),lower_pivot[1]+0.5*163.241)
          hoof_pivot=(lower[0]+0.5*(-34.745),lower[1]+0.5*160.511)
          hoof=(hoof_pivot[0]+0.5*49.841,hoof_pivot[1]+0.5*181.998)

          body_center=(724-76.5412,543-101.756)
          tail_center=(724-449+0.39*(-102.18),543-198+0.39*270.66)

          def draw_leg(dst):
              place_center(dst,crops["upper"],upper,0.5)
              place_center(dst,crops["lower"],lower,0.5)
              place_center(dst,crops["hoof"],hoof,0.5)

          ref=checker.copy(); ref.alpha_composite(master)

          front=checker.copy()
          place_center(front,tail,tail_center,0.39)
          place_center(front,body,body_center,0.695201,math.degrees(0.0239099))
          draw_leg(front)

          behind=checker.copy()
          place_center(behind,tail,tail_center,0.39)
          draw_leg(behind)
          place_center(behind,body,body_center,0.695201,math.degrees(0.0239099))

          out=Image.new("RGBA",(W*3,H),(0,0,0,255))
          out.alpha_composite(ref,(0,0))
          out.alpha_composite(front,(W,0))
          out.alpha_composite(behind,(W*2,0))
          od=ImageDraw.Draw(out)
          labels=["MASTER","HindLeftColumn IN FRONT OF BODY","HindLeftColumn BEHIND BODY"]
          for i,label in enumerate(labels):
              x=i*W
              od.rectangle((x,0,x+620,48),fill=(0,0,0,180))
              od.text((x+12,13),label,fill="white")

          Path("debug").mkdir(exist_ok=True)
          out.convert("RGB").resize((2172,543),Image.Resampling.LANCZOS).save(
              "debug/first_hind_leg_layering.jpg",quality=72,optimize=True
          )
          PY
      - name: Commit preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/first_hind_leg_layering.jpg
          git commit -m "Record first hind leg layering preview"
          git push origin HEAD:main
