name: Extract Runtime Assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/extract-runtime-assets.yml"
      - "tools/extract_runtime_assets.py"
      - "asset_packs/Pferd-und-Steve-runtime-assets-v01.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract exact canonical assets
        run: python tools/extract_runtime_assets.py

      - name: Commit extracted runtime assets
        shell: bash
        run: |
          if git diff --quiet -- assets; then
            echo "No asset changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Extract canonical runtime assets v01"
          git push
